
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaik Mart | Online Shopping</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }
        header {
            background: #102a43;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        header h1 { margin: 0; }
        header span { color: #ffd166; }
        .cart { font-weight: bold; }
        .hero {
            background: linear-gradient(120deg, #1565c0, #102a43);
            color: white;
            padding: 55px 7%;
        }
        .hero h2 { font-size: 38px; margin: 0 0 12px; }
        .hero p { font-size: 17px; }
        main { padding: 30px 7%; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 22px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 15px #0000000d;
        }
        .picture {
            font-size: 60px;
            text-align: center;
            padding: 20px 0;
            background: #edf4fb;
            border-radius: 10px;
        }
        .card h3 { margin-bottom: 8px; }
        .price { font-size: 22px; font-weight: bold; color: #1565c0; }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #1565c0;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #0d47a1; }
        footer {
            text-align: center;
            padding: 24px;
            background: #102a43;
            color: white;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ <span>Shaik</span> Mart</h1>
        <div class="cart">🛒 Cart: <span id="cart">0</span></div>
    </header>
    <section id="cart-details" style="display:none; padding:20px 7%; background:white;">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <p><strong>Total: ₹<span id="cart-total">0</span></strong></p>
        <button onclick="clearCart()">Clear Cart</button>
    </section>

    <section class="hero">
        <h2>Welcome to Shaik Mart!</h2>
        <p>Discover everyday essentials and great deals, all in one place.</p>
    </section>

    <main>
        <h2>Featured Products</h2>
        <p>Find something you love.</p>
        <div class="products" id="products">
            <p>Loading products...</p>
        </div>
    </main>

    <footer>© 2026 Shaik Mart | Happy Shopping!</footer>

    <script>
        
        let cart = [];

        fetch('/api/products')
            .then(response => {
                if (!response.ok) throw new Error('Could not load products');
                return response.json();
            })
            .then(products => {
                const container = document.getElementById('products');
                container.innerHTML = '';

                const icons = ['🎧', '⌚', '🎒', '🔊'];

                products.forEach((product, index) => {
                    const card = document.createElement('article');
                    card.className = 'card';

                    const picture = document.createElement('div');
                    picture.className = 'picture';
                    picture.textContent = icons[index % icons.length];

                    const name = document.createElement('h3');
                    name.textContent = product.name;

                    const price = document.createElement('p');
                    price.className = 'price';
                    price.textContent = '₹' + Number(product.price).toLocaleString('en-IN');

                    const button = document.createElement('button');
                    button.textContent = 'Add to Cart';
                    button.addEventListener('click', () => {
    const existing = cart.find(item => item.id === product.id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    updateCart();
    button.textContent = 'Added ✓';
    setTimeout(() => button.textContent = 'Add to Cart', 800);
});
                        cartCount++;
                        document.getElementById('cart').textContent = cartCount;
                        button.textContent = 'Added ✓';
                        setTimeout(() => button.textContent = 'Add to Cart', 800);
                    });

                    card.append(picture, name, price, button);

                    container.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('products').textContent =
                    'Products could not be loaded. Please refresh the page.';
            });

function updateCart() {
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    document.getElementById('cart').textContent = count;
    document.getElementById('cart-details').style.display =
        cart.length ? 'block' : 'none';

    const container = document.getElementById('cart-items');
    container.innerHTML = '';

    cart.forEach(item => {
        const row = document.createElement('p');
        row.textContent = `${item.name} × ${item.quantity} — ₹${(item.price * item.quantity).toLocaleString('en-IN')}`;

        const remove = document.createElement('button');
        remove.textContent = 'Remove one';
        remove.style.width = 'auto';
        remove.style.marginLeft = '10px';

        remove.addEventListener('click', () => {
            item.quantity--;

            if (item.quantity <= 0) {
                cart = cart.filter(product => product.id !== item.id);
            }

            updateCart();
        });

        row.appendChild(remove);
        container.appendChild(row);
    });

    document.getElementById('cart-total').textContent =
        total.toLocaleString('en-IN');
}

function clearCart() {
    cart = [];
    updateCart();
}
</script>
</body>
</html>
